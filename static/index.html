<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>totonoumovie</title>
<link rel="icon" href="/static/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand" id="brandHome" title="プロジェクトの一覧（トップ）へ戻る"><img src="/static/totono/logo.svg" alt="" class="brand-logo"> totonoumovie <span id="projName" class="muted"></span></div>
  <div class="proj">
    <button id="btnHome" title="プロジェクトの一覧へ">📁<span class="lbl"> 一覧</span></button>
    <select id="projSelect" title="プロジェクトを切り替え"></select>
    <span id="saveState" class="muted small"></span>
  </div>
  <div class="actions">
    <button id="btnUndo" title="直前の操作を取り消す (⌘Z)">↶</button>
    <button id="btnRedo" title="やり直し (⌘⇧Z)">↷</button>
    <button id="btnCreate" title="動画を渡して、TotonouMovie の手順で AI に作ってもらう">🎬 AIで作る</button>
    <button id="btnAI" title="AI の作業の様子と確認待ち">🤖 AI <span id="aiBadge" class="badge hidden"></span></button>
    <button id="btnMine" title="自分好みに育てる（マイスタイル・スキル・表記辞書・設定・効果音・引き継ぎ）">🌱<span class="lbl"> 自分好み</span></button>
    <button id="btnPrompts" title="AI に渡すプロンプトを見る・書き換える・いつもの指示を作る">✍<span class="lbl"> プロンプト</span></button>
    <button id="btnTour" title="トトノちゃんが画面を案内します">🎓 ツアー</button>
    <button id="btnVideos" title="使い方を動画で見る（全体像・字幕・カット・書き出しなど）">▶ 使い方動画</button>
    <button id="btnMute" title="トトノちゃんの声のオン・オフ">🔊 声</button>
    <span class="sep"></span>
    <button id="btnQA" class="needp" title="字幕の点検と書き出し前の検査">🔍<span class="lbl"> 検査</span></button>
    <button id="btnStill" class="needp" title="今の位置を Remotion で静止画にする（完成と同じ見た目）">📷<span class="lbl"> 静止画</span></button>
    <button id="btnPreview" class="needp" title="今の位置の前後を、音付きで試作する">🎞<span class="lbl"> 試作</span></button>
    <button id="btnExport" class="primary needp" title="完成動画を書き出す">⬇ 書き出し</button>
  </div>
</header>

<!-- プロジェクト一覧（ホーム） -->
<section id="home" class="hidden">
  <div class="home-inner">
    <div id="statusBox"></div>
    <div class="home-head">
      <h2>プロジェクト</h2>
      <span id="wsPath" class="muted small"></span>
      <span class="grow"></span>
      <button id="btnCreate2" class="primary">🎬 動画を渡して AI で作る</button>
      <button id="btnReloadProjects">🔄 更新</button>
    </div>
    <div id="projGrid"></div>
    <div id="welcome" class="hidden">
      <div id="welcomeChara"></div>
      <div class="welcome-or">
        <span class="muted">準備ができたら、編集したい動画を1本選ぶだけ</span>
        <button id="btnCreate3" class="primary big">🎬 動画を渡して AI で作る</button>
      </div>
    </div>
  </div>
</section>

<!-- 編集画面 -->
<main id="editor" class="hidden">
  <section id="side">
    <div class="tabs" id="sideTabs">
      <button data-t="telops" class="on">字幕</button>
      <button data-t="cuts">カット承認</button>
      <button data-t="ai">AI</button>
      <button data-t="files">素材・出力</button>
    </div>
    <div id="sideBody"></div>
  </section>

  <section id="center">
    <div id="stageWrap">
      <div id="stage">
        <video id="video" playsinline preload="auto"></video>
        <div id="overlay"></div>
      </div>
    </div>
    <div id="transport">
      <button id="btnBack" title="5秒戻る">⏪</button>
      <button id="btnPlay" title="再生/停止 (Space)">▶</button>
      <button id="btnFwd" title="5秒進む">⏩</button>
      <span id="timeLabel">0:00.0</span>
      <label class="chk" title="カットした区間を飛ばして再生（完成と同じ流れ）"><input type="checkbox" id="skipCuts" checked> カットを飛ばす</label>
      <label class="chk" title="字幕・画像などを重ねて表示（見た目は近似です。正確には静止画で確認）"><input type="checkbox" id="showOverlay" checked> 重ねて表示</label>
      <span id="proxyState" class="muted small"></span>
    </div>
  </section>

  <section id="inspector">
    <div id="inspBody"></div>
  </section>
</main>

<section id="timelineArea" class="hidden">
  <div id="tlToolbar">
    <label>ズーム <input type="range" id="zoom" min="5" max="300" value="40"></label>
    <span class="muted small">ダブルクリックで追加／ドラッグで移動・端で長さ／Delete で削除／⌘D 複製／⌘S 保存（自動保存あり）</span>
  </div>
  <div id="timeline">
    <div id="tlLabels"></div>
    <div id="tlScroll"><div id="tlInner"><div id="tlRows"></div><div id="playhead"></div></div></div>
  </div>
</section>

<div id="jobBar"></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"><div class="modal-box" id="modalBox"><div id="modalBody"></div></div></div>

<script src="/static/totono.js"></script>
<script src="/static/app.js"></script>
<script src="/static/panels.js"></script>
<script src="/static/mine.js"></script>
</body>
</html>
